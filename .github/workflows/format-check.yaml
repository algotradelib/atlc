# Checks the layout against .clang-format and fails on any difference; it never changes a file.
on:
  workflow_dispatch:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

name: format-check

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: algotradelib/.github/actions/format-check@main
        with:
          exclude: "tests/codegen"
          markdown: "README.md runtime/README.md docs/*.md"
